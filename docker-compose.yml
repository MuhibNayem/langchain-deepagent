version: '3.9'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    image: ghcr.io/amnayem/luminamind:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "8080:8080"
      - "9090:9090"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - CHECKPOINT_REDIS_URL=redis://redis:6379
      - RATE_LIMIT_REDIS_URL=redis://redis:6379
      - LUMINAMIND_API_KEYS=${LUMINAMIND_API_KEYS:-}
    volumes:
      - ./sessions:/app/sessions
      - ./skills:/app/skills
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    image: ghcr.io/amnayem/luminamind:latest
    command: python -m luminamind.worker
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      - CHECKPOINT_REDIS_URL=redis://redis:6379
    scale: 3
    restart: unless-stopped

  dashboard:
    image: ghcr.io/amnayem/luminamind:latest
    command: python -m luminamind.monitoring.dashboard
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - LUMINAMIND_API_URL=http://api:8000
    restart: unless-stopped

volumes:
  redis_data:
